services:
  dbpostgresUser:
      container_name: dbpostgresUser
      image: postgres:latest
      environment:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: Lagavi30!
          POSTGRES_DB: root
          POOLING: "true"
          PGDATA: /var/lib/postgresql/data/pgdata
      ports:
          - "5433:5432"
      volumes:
          - user_data:/var/lib/postgresql/data
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U root"]
          interval: 10s
          timeout: 5s
          retries: 5
      networks:
          - app-network

  backend:
    build: ./
    container_name: backend-user
    ports:
      - 5000:5000
    environment:
      ConnectionStrings__DefaultConnectionString: User ID=root;Password=Lagavi30!;Host=dbpostgresUser;Database=root;Pooling=true;MinPoolSize=0;MaxPoolSize=100;Connection Lifetime=0;
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - dbpostgresUser
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  user_data:
