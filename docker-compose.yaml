services:
  sqlserver-user:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserverdbuser
    environment:
      - SA_PASSWORD=Lagavi30!
      - ACCEPT_EULA=Y
    ports:
      - "1434:1433"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd", "-U", "sa", "-P", "Lagavi30!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./
    container_name: backend-user
    ports:
      - 5000:5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - sqlserver-user
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
